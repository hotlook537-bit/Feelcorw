name: Build Lulugram APK

on:
  push:
    branches: [ "main" ] # Jab aap main branch par push karenge tab chalega
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' # Aapki app build.gradle.kts ke mutabik Java 21 required hai
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    - name: Recreate google-services.json from Secret
      run: |
        echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Build Artifact (APK)
      uses: actions/upload-artifact@v4
      with:
        name: lulugram-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
