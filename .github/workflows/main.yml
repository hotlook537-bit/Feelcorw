name: Build Lulugram APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Agar repository me gradlew nahi hai, to ye workflow khud ek naya wrapper generate karega
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Firebase json create karega app folder ke andar
    - name: Recreate google-services.json from Secret
      run: |
        mkdir -p app
        echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

    # Global gradle command ka use karke build karega (bina ./gradlew ke)
    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload Build Artifact (APK)
      uses: actions/upload-artifact@v4
      with:
        name: lulugram-debug-apk
        path: "**/build/outputs/apk/debug/app-debug.apk"
