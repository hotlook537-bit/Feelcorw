name: Build Lulugram APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # Ye step automatically check karega ki gradlew file kis folder me hai
    - name: Grant Execute Permission for Gradle Wrapper
      run: |
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "ERROR: gradlew file poori repository me kahi nahi mili!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        chmod +x "$GRADLEW_PATH"

    # Firebase json create karega jahan gradlew file hai uske app folder me
    - name: Recreate google-services.json from Secret
      run: |
        mkdir -p "${{ env.PROJECT_DIR }}/app"
        echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > "${{ env.PROJECT_DIR }}/app/google-services.json"

    # Sahi folder ke andar jaakar APK build karega
    - name: Build Debug APK
      run: |
        cd "${{ env.PROJECT_DIR }}"
        ./gradlew assembleDebug --stacktrace

    # Built APK ko upload karega
    - name: Upload Build Artifact (APK)
      uses: actions/upload-artifact@v4
      with:
        name: lulugram-debug-apk
        path: "**/build/outputs/apk/debug/app-debug.apk"
